<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Network Graph | Bluesky Analyzer</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/info-panel.css">
  <script src="https://unpkg.com/force-graph"></script>
  <style>
    body { overflow: hidden; margin: 0; background: #0c0e14; }
    .graph-controls {
      position: absolute;
      top: 1rem;
      left: 1rem;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      pointer-events: none;
    }
    .graph-controls > * { pointer-events: all; }
    .graph-overlay {
        position: absolute;
        bottom: 1rem;
        left: 1rem;
        background: rgba(19, 22, 31, 0.8);
        padding: 0.75rem;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        font-family: var(--mono);
        font-size: 0.7rem;
        pointer-events: none;
    }
  </style>
</head>
<body>

<div class="graph-controls">
  <a href="/" class="btn btn-ghost">← Back to Dashboard</a>
  <button id="reset-btn" class="btn btn-primary" style="display:none;" onclick="resetToMacro()">Reset to Macro-view</button>
  <button id="community-overview-btn" class="btn btn-ghost" onclick="showCommunityOverview()">Show Communities</button>
  <button id="back-to-community-btn" class="btn btn-ghost" style="display:none;" onclick="backToCommunityOverview()">← Back to Communities</button>
  <div style="background: var(--surface); padding: 0.5rem; border-radius: var(--radius-sm); border: 1px solid var(--border); pointer-events: all;">
    <label class="toggle-wrap" title="Toggle flow particles">
      <input type="checkbox" id="particle-toggle" checked onchange="toggleParticles(this.checked)">
      <span class="toggle-slider"></span>
      <span style="font-size: 0.7rem; color: var(--muted); margin-left: 0.3rem; white-space: nowrap;">Flow Particles</span>
    </label>
  </div>
  <div style="background: var(--surface); padding: 0.5rem; border-radius: var(--radius-sm); border: 1px solid var(--border);">
    <div class="sidebar-label" style="padding: 0 0 0.25rem 0">Graph Status</div>
    <div id="graph-status" style="font-size: 0.75rem; color: var(--muted);">Initializing...</div>
  </div>
</div>

<div class="graph-overlay" id="graph-meta">
  Mode: Macro-View (Stratified Sample)<br>
  Nodes: -- | Links: --
</div>

{% include 'partials/_info_panel.html' %}

<div id="graph-container"></div>

<script>const ACTIVE_ALIAS = "{{ alias }}";</script>
<script src="/static/js/community-view.js"></script>
<script src="/static/js/profile-view.js"></script>
<script src="/static/js/info-panel.js"></script>
<script src="/static/js/graph.js"></script>
</body>
</html>
